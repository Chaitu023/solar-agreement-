function sig(input,preview,target){$(input).addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let a=new Image();a.src=r.result;$(preview).replaceChildren(a);let b=new Image();b.src=r.result;b.className='sigimg';$(target).replaceChildren(b)};r.readAsDataURL(f)})}
sig('csig','cp','pcs');sig('vsig','vp','pvs');
function resetAll(){if(!confirm('Clear all fields and signature uploads?'))return;document.querySelectorAll('input:not([type=file]),textarea').forEach(e=>e.value='');['csig','vsig'].forEach(id=>$(id).value='');$('cp').textContent='Consumer signature preview';$('vp').textContent='Vendor signature preview';$('pcs').replaceChildren();$('pvs').replaceChildren();sync()}
sync();
